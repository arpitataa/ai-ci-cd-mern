name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # -------------------------
    # SERVER INSTALL
    # -------------------------

    - name: Install server dependencies
      working-directory: server
      run: |
        npm install 2>&1 | tee server-log.txt

    # -------------------------
    # CLIENT INSTALL
    # -------------------------

    - name: Install client dependencies
      working-directory: client
      run: |
        npm install 2>&1 | tee client-install-log.txt

    # -------------------------
    # REACT BUILD
    # THIS IS IMPORTANT
    # -------------------------

    - name: Build React App
      working-directory: client
      run: |
        npm run build 2>&1 | tee build-log.txt

    # -------------------------
    # DOCKER LOGIN
    # -------------------------

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    # -------------------------
    # BUILD SERVER IMAGE
    # -------------------------

    - name: Build Server Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-ci-cd-server:latest ./server 2>&1 | tee docker-server-log.txt

    # -------------------------
    # PUSH SERVER IMAGE
    # -------------------------

    - name: Push Server Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/ai-ci-cd-server:latest

    # -------------------------
    # BUILD CLIENT IMAGE
    # -------------------------

    - name: Build Client Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-ci-cd-client:latest ./client 2>&1 | tee docker-client-log.txt

    - name: Verify Client Image Exists
      run: |
        docker images | grep ai-ci-cd-client

    # -------------------------
    # PUSH CLIENT IMAGE
    # -------------------------

    - name: Push Client Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/ai-ci-cd-client:latest

    - name: Deploy to EC2
      if: success()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/project

          docker system prune -f

          docker pull ${{ secrets.DOCKER_USERNAME }}/ai-ci-cd-server:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/ai-ci-cd-client:latest

          docker compose up -d --remove-orphans
      
    - name: Send Success Logs to Backend
      if: success()
      run: |
        curl -X POST http://13.206.144.172:5000/api/logs \
        -H "Content-Type: application/json" \
        -d "$(jq -n \
          --arg status "success" \
          --arg logs "Build, Docker image push, and EC2 deployment completed successfully." \
          '{status: $status, logs: $logs}')"

    - name: Send Failure Logs to Backend
      if: failure()
      run: |
        LOG_CONTENT="Pipeline failed. Check GitHub Actions logs."

        if [ -f client/build-log.txt ]; then
          LOG_CONTENT=$(cat client/build-log.txt)
        elif [ -f client/client-install-log.txt ]; then
          LOG_CONTENT=$(cat client/client-install-log.txt)
        elif [ -f server/server-log.txt ]; then
          LOG_CONTENT=$(cat server/server-log.txt)
        elif [ -f docker-server-log.txt ]; then
          LOG_CONTENT=$(cat docker-server-log.txt)
        elif [ -f docker-client-log.txt ]; then
          LOG_CONTENT=$(cat docker-client-log.txt)
        fi

        curl -X POST http://13.206.144.172:5000/api/logs \
        -H "Content-Type: application/json" \
        -d "$(jq -n \
          --arg status "failed" \
          --arg logs "$LOG_CONTENT" \
          '{status: $status, logs: $logs}')"